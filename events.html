<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - SoldOutSoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div id="nav-placeholder"></div>
    <section class="section">
        <div class="container">
            <div class="page-title-row">
                <h1>Upcoming events</h1>
                <span class="result-count" id="result-count"></span>
            </div>

            <form id="filter-form" class="filter-card" onsubmit="return false;">
                <div class="filter-field">
                    <label for="search-name">Search</label>
                    <input type="text" id="search-name" placeholder="Event or artist...">
                </div>
                <div class="filter-field">
                    <label for="search-genre">Genre</label>
                    <select id="search-genre">
                        <option value="">All genres</option>
                        <option value="Pop">Pop</option>
                        <option value="Rock">Rock</option>
                        <option value="Hip Hop/Rap">Hip Hop/Rap</option>
                        <option value="R&B">R&B</option>
                        <option value="Jazz">Jazz</option>
                        <option value="Dance/Electronic">Dance/Electronic</option>
                        <option value="Blues">Blues</option>
                        <option value="Indie">Indie</option>
                        <option value="Arabic">Arabic</option>
                        <option value="Classical">Classical</option>
                        <option value="Metal">Metal</option>
                        <option value="Country">Country</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="search-location">City</label>
                    <input type="text" id="search-location" placeholder="Any city">
                </div>
                <div class="filter-field">
                    <label for="search-date-from">From date</label>
                    <input type="date" id="search-date-from">
                </div>
                <div class="filter-field">
                    <label for="sort">Sort by</label>
                    <select id="sort">
                        <option value="date-asc">Soonest</option>
                        <option value="price-asc">Price: low to high</option>
                        <option value="price-desc">Price: high to low</option>
                    </select>
                </div>
                <button type="button" id="filter-btn" class="btn btn-primary">Filter</button>
                <button type="button" id="reset-btn" class="btn btn-outline">Reset</button>
            </form>

            <div id="events-grid" class="event-grid"></div>
            <div id="empty-state" class="empty-state hidden">
                <i class="fas fa-calendar-xmark" aria-hidden="true"></i>
                <h3>No events match yet</h3>
                <p>Try a different search, genre or date range.</p>
                <button id="clear-filters-btn" class="btn btn-primary" style="margin-top:16px;">Clear filters</button>
            </div>
        </div>
    </section>
    <div id="footer-placeholder"></div>

    <script>
        function urgencyTag(event) {
            const types = event.ticketTypes || [];
            const available = types.reduce((sum, t) => sum + (t.available || 0), 0);
            const total = types.reduce((sum, t) => sum + (t.total || t.available || 0), 0);
            if (available > 0 && available <= 20) return { text: `Only ${available} left` };
            if (total > 0 && (available / total) < 0.4) return { text: 'Selling fast' };
            return { text: 'Just added' };
        }

        function renderEventCard(event) {
            const date = new Date(event.eventDate);
            const month = date.toLocaleDateString('en-US', { month: 'short' });
            const day = date.getDate();
            const urgency = urgencyTag(event);
            const fromPrice = Math.min(...event.ticketTypes.map(t => t.price)).toFixed(2);
            const genre = (event.genres && event.genres[0]) || 'Live';
            return `
                <a href="event-detail.html?id=${event._id}" class="event-card">
                    <div class="media">
                        <img src="${event.images[0]}" alt="${event.eventName}">
                        <div class="date-badge"><span class="mon">${month}</span><span class="day">${day}</span></div>
                        <span class="urgency-tag"><span class="dot"></span>${urgency.text}</span>
                    </div>
                    <div class="body">
                        <div class="kicker">${genre}</div>
                        <h3>${event.eventName}</h3>
                        <div class="meta-row"><i class="fas fa-location-dot" aria-hidden="true"></i> ${event.venue.name}, ${event.venue.location.city}</div>
                        <div class="meta-row"><i class="fas fa-clock" aria-hidden="true"></i> ${date.toLocaleDateString()} &bull; ${event.eventTime}</div>
                        <div class="card-footer">
                            <div class="price-from"><span class="label">From</span><span class="price">$${fromPrice}</span></div>
                            <span class="btn btn-primary btn-sm">Details</span>
                        </div>
                    </div>
                </a>
            `;
        }

        function displayEvents(eventList) {
            const grid = document.getElementById('events-grid');
            const empty = document.getElementById('empty-state');
            const count = document.getElementById('result-count');
            grid.innerHTML = '';
            count.textContent = eventList.length + (eventList.length === 1 ? ' event' : ' events');
            if (eventList.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            grid.classList.remove('hidden');
            empty.classList.add('hidden');
            eventList.forEach(event => {
                grid.innerHTML += renderEventCard(event);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('nav.html').then(res => res.text()).then(html => document.getElementById('nav-placeholder').innerHTML = html);
            fetch('footer.html').then(res => res.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html);

            // Fetch events from the backend
            fetch('/api/events')
                .then(response => response.json())
                .then(data => {
                    const urlParams = new URLSearchParams(window.location.search);

                    // Pre-fill search fields from URL params
                    document.getElementById('search-name').value = urlParams.get('q') || '';
                    document.getElementById('search-genre').value = urlParams.get('genre') || '';
                    document.getElementById('search-date-from').value = urlParams.get('from') || '';
                    document.getElementById('search-location').value = urlParams.get('location') || '';
                    document.getElementById('sort').value = urlParams.get('sort') || 'date-asc';

                    function filterEvents() {
                        const searchTerm = document.getElementById('search-name').value.toLowerCase();
                        const genre = document.getElementById('search-genre').value;
                        const dateFrom = document.getElementById('search-date-from').value;
                        const location = document.getElementById('search-location').value.toLowerCase();
                        const sort = document.getElementById('sort').value;

                        let filtered = data.filter(event => {
                            const date = new Date(event.eventDate);
                            const artistMatch = event.artists.some(artist =>
                                artist.name.toLowerCase().includes(searchTerm)
                            );

                            return (
                                (!searchTerm ||
                                 event.eventName.toLowerCase().includes(searchTerm) ||
                                 artistMatch) &&
                                (!genre || event.genres.includes(genre)) &&
                                (!dateFrom || date >= new Date(dateFrom)) &&
                                (!location || event.venue.location.city.toLowerCase().includes(location))
                            );
                        });

                        filtered.sort((a, b) => {
                            if (sort === 'price-asc' || sort === 'price-desc') {
                                const priceA = Math.min(...a.ticketTypes.map(t => t.price));
                                const priceB = Math.min(...b.ticketTypes.map(t => t.price));
                                return sort === 'price-asc' ? priceA - priceB : priceB - priceA;
                            }
                            return new Date(a.eventDate) - new Date(b.eventDate);
                        });

                        displayEvents(filtered);
                    }

                    function updateUrl() {
                        const params = new URLSearchParams();
                        const searchTerm = document.getElementById('search-name').value;
                        if (searchTerm) params.append('q', searchTerm);
                        if (document.getElementById('search-genre').value)
                            params.append('genre', document.getElementById('search-genre').value);
                        if (document.getElementById('search-date-from').value)
                            params.append('from', document.getElementById('search-date-from').value);
                        if (document.getElementById('search-location').value)
                            params.append('location', document.getElementById('search-location').value);
                        if (document.getElementById('sort').value !== 'date-asc')
                            params.append('sort', document.getElementById('sort').value);

                        window.history.replaceState({}, '', `?${params.toString()}`);
                    }

                    document.getElementById('filter-btn').addEventListener('click', () => {
                        updateUrl();
                        filterEvents();
                    });

                    document.getElementById('reset-btn').addEventListener('click', () => {
                        document.getElementById('filter-form').reset();
                        window.history.replaceState({}, '', window.location.pathname);
                        filterEvents();
                    });

                    document.getElementById('clear-filters-btn').addEventListener('click', () => {
                        document.getElementById('filter-form').reset();
                        window.history.replaceState({}, '', window.location.pathname);
                        filterEvents();
                    });

                    filterEvents(); // Initial display
                })
                .catch(error => {
                    console.error('Error fetching events:', error);
                    alert('Failed to load events. Please try again later.');
                });
        });
    </script>
</body>
</html>
