<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - SoldOutSoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .ticket-card { transition: all 0.3s ease; }
        .ticket-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <section class="py-16 bg-gray-50">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-gray-800 mb-10">Upcoming Events</h2>
            <div class="bg-white rounded-lg shadow-md p-4 mb-6">
                <div class="flex flex-col md:flex-row items-center space-y-4 md:space-y-0 md:space-x-4">
                    <input type="text" id="search-name" placeholder="Search events or artists..." class="w-full md:w-1/4 px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <select id="search-genre" class="w-full md:w-1/4 px-4 py-2 rounded border border-gray-300">
                        <option value="">All Genres</option>
                        <option value="Pop">Pop</option>
                        <option value="Rock">Rock</option>
                        <option value="Hip Hop/Rap">Hip Hop/Rap</option>
                        <option value="R&B">R&B</option>
                        <option value="Jazz">Jazz</option>
                        <option value="Dance/Electronic">Dance/Electronic</option>
                        <option value="Blues">Blues</option>
                        <option value="Indie">Indie</option>
                        <option value="Arabic">Arabic</option>
                        <option value="Classical">Classical</option>
                        <option value="Metal">Metal</option>
                        <option value="Country">Country</option>
                    </select>
                    <input type="date" id="search-date-from" class="px-3 py-1 border border-gray-300 rounded">
                    <input type="date" id="search-date-to" class="px-3 py-1 border border-gray-300 rounded">
                    <input type="text" id="search-location" placeholder="City" class="px-3 py-1 border border-gray-300 rounded">
                    <select id="sort" class="px-3 py-1 border border-gray-300 rounded">
                        <option value="date-asc">Date (Soonest)</option>
                        <option value="date-desc">Date (Latest)</option>
                    </select>
                    <button id="filter-btn" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Filter</button>
                </div>
            </div>
            <div id="events-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </div>
    </section>
    <div id="footer-placeholder"></div>

    <script>
        function displayEvents(eventList) {
            const grid = document.getElementById('events-grid');
            grid.innerHTML = '';
            eventList.forEach(event => {
                grid.innerHTML += `
                    <div class="ticket-card bg-white rounded-lg overflow-hidden shadow-md">
                        <div class="relative">
                            <img src="${event.images[0]}" alt="${event.eventName}" class="w-full h-48 object-cover">
                            <span class="absolute top-2 right-2 bg-${event.isActive ? 'green' : 'red'}-500 text-white text-xs font-bold px-2 py-1 rounded-full">${event.isActive ? 'Active' : 'Inactive'}</span>
                        </div>
                        <div class="p-4">
                            <h3 class="text-xl font-bold text-gray-800 mb-2">${event.eventName}</h3>
                            <p class="text-gray-600 text-sm mb-2"><i class="fas fa-calendar-day mr-1"></i> ${new Date(event.eventDate).toLocaleDateString()} • ${event.eventTime}</p>
                            <p class="text-gray-600 text-sm mb-3"><i class="fas fa-map-marker-alt mr-1"></i> ${event.venue.location.city}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-purple-600 font-bold">From $${Math.min(...event.ticketTypes.map(t => t.price)).toFixed(2)}</span>
                                <a href="event-detail.html?id=${event._id}" class="bg-purple-600 text-white px-4 py-1 rounded-full text-sm hover:bg-purple-700">Details</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('nav.html').then(res => res.text()).then(html => document.getElementById('nav-placeholder').innerHTML = html);
            fetch('footer.html').then(res => res.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html);

            // Fetch events from the backend
            fetch('/api/events')
                .then(response => response.json())
                .then(data => {
                    const urlParams = new URLSearchParams(window.location.search);
                    
                    // Pre-fill search fields from URL params
                    document.getElementById('search-name').value = urlParams.get('q') || '';
                    document.getElementById('search-genre').value = urlParams.get('genre') || '';
                    document.getElementById('search-date-from').value = urlParams.get('from') || '';
                    document.getElementById('search-date-to').value = urlParams.get('to') || '';
                    document.getElementById('search-location').value = urlParams.get('location') || '';
                    document.getElementById('sort').value = urlParams.get('sort') || 'date-asc';

                    function filterEvents() {
                        const searchTerm = document.getElementById('search-name').value.toLowerCase();
                        const genre = document.getElementById('search-genre').value;
                        const dateFrom = document.getElementById('search-date-from').value;
                        const dateTo = document.getElementById('search-date-to').value;
                        const location = document.getElementById('search-location').value.toLowerCase();
                        const sort = document.getElementById('sort').value;

                        let filtered = data.filter(event => {
                            const date = new Date(event.eventDate);
                            const artistMatch = event.artists.some(artist => 
                                artist.name.toLowerCase().includes(searchTerm)
                            );
                            
                            return (
                                (!searchTerm || 
                                 event.eventName.toLowerCase().includes(searchTerm) || 
                                 artistMatch) &&
                                (!genre || event.genres.includes(genre)) &&
                                (!dateFrom || date >= new Date(dateFrom)) &&
                                (!dateTo || date <= new Date(dateTo)) &&
                                (!location || event.venue.location.city.toLowerCase().includes(location))
                            );
                        });

                        filtered.sort((a, b) => sort === 'date-asc' ? 
                            new Date(a.eventDate) - new Date(b.eventDate) : 
                            new Date(b.eventDate) - new Date(a.eventDate));
                        
                        displayEvents(filtered);
                    }

                    document.getElementById('filter-btn').addEventListener('click', () => {
                        // Update URL with current search parameters
                        const params = new URLSearchParams();
                        const searchTerm = document.getElementById('search-name').value;
                        if (searchTerm) params.append('q', searchTerm);
                        if (document.getElementById('search-genre').value) 
                            params.append('genre', document.getElementById('search-genre').value);
                        if (document.getElementById('search-date-from').value) 
                            params.append('from', document.getElementById('search-date-from').value);
                        if (document.getElementById('search-date-to').value) 
                            params.append('to', document.getElementById('search-date-to').value);
                        if (document.getElementById('search-location').value) 
                            params.append('location', document.getElementById('search-location').value);
                        if (document.getElementById('sort').value !== 'date-asc') 
                            params.append('sort', document.getElementById('sort').value);
                        
                        window.history.replaceState({}, '', `?${params.toString()}`);
                        filterEvents();
                    });

                    filterEvents(); // Initial display
                })
                .catch(error => {
                    console.error('Error fetching events:', error);
                    alert('Failed to load events. Please try again later.');
                });
        });
    </script>
</body>
</html>
