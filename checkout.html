<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - SoldOutSoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div id="nav-placeholder"></div>
    <section class="section">
        <div class="container">
            <div class="page-title-row"><h1>Checkout</h1></div>
            <div class="checkout-layout">
                <div class="panel">
                    <h2>Order summary</h2>
                    <div id="checkout-summary"></div>
                </div>
                <div class="panel">
                    <h2>Payment method</h2>
                    <div class="field">
                        <label for="payment-method">Card</label>
                        <select id="payment-method" style="width:100%;height:48px;border:1.5px solid var(--lines);border-radius:12px;padding:0 14px;font-size:14.5px;font-family:inherit;">
                            <option value="visa">Visa ending in 1234</option>
                            <option value="mastercard">MasterCard ending in 5678</option>
                        </select>
                    </div>
                    <button id="pay-now" class="btn btn-primary btn-block">Pay now</button>
                    <div class="trust-notes">
                        <div class="trust-note"><i class="fas fa-lock" aria-hidden="true"></i> Secure, encrypted checkout</div>
                        <div class="trust-note"><i class="fas fa-bolt" aria-hidden="true"></i> Instant e-tickets by email</div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div id="footer-placeholder"></div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('nav.html').then(res => res.text()).then(html => document.getElementById('nav-placeholder').innerHTML = html);
            fetch('footer.html').then(res => res.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html);

            const checkout = JSON.parse(localStorage.getItem('checkout'));
            if (!checkout) {
                document.getElementById('checkout-summary').innerHTML = '<p>No items in checkout.</p>';
                return;
            }

            // Display checkout summary
            document.getElementById('checkout-summary').innerHTML = `
                <div class="summary-box">
                    <div class="summary-row"><span>Event</span><span>${checkout.eventName || ''}</span></div>
                    <div class="summary-row"><span>Ticket type</span><span>${checkout.ticketType}</span></div>
                    <div class="summary-row"><span>Quantity</span><span>${checkout.qty}</span></div>
                    <div class="summary-row total"><span>Total</span><span>$${checkout.total}</span></div>
                </div>
            `;

            // Handle payment
            document.getElementById('pay-now').addEventListener('click', async () => {
                const user = getCurrentUser();
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                const orderData = {
                    userId: user._id,
                    eventId: checkout.eventId,
                    ticketType: checkout.ticketType,
                    qty: checkout.qty,
                    total: checkout.total,
                    paymentMethod: document.getElementById('payment-method').value,
                };

                try {
                    const response = await fetch('/api/orders', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${user.token}`,
                        },
                        body: JSON.stringify(orderData),
                    });

                    if (response.ok) {
                        alert('Payment successful! Your tickets have been sent to your email.');
                        localStorage.removeItem('checkout');
                        window.location.href = 'my-tickets.html';
                    } else {
                        const error = await response.json();
                        alert(error.message || 'Payment failed. Please try again.');
                    }
                } catch (error) {
                    console.error('Error processing payment:', error);
                    alert('An error occurred. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
