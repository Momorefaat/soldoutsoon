<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Detail - SoldOutSoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div id="nav-placeholder"></div>
    <div id="event-detail"></div>
    <div id="footer-placeholder"></div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script>
        function urgencyTag(event) {
            const types = event.ticketTypes || [];
            const available = types.reduce((sum, t) => sum + (t.available || 0), 0);
            const total = types.reduce((sum, t) => sum + (t.total || t.available || 0), 0);
            if (available > 0 && available <= 20) return `Only ${available} left`;
            if (total > 0 && (available / total) < 0.4) return 'Selling fast';
            return 'Just added';
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('nav.html').then(res => res.text()).then(html => document.getElementById('nav-placeholder').innerHTML = html);
            fetch('footer.html').then(res => res.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html);

            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('id');

            if (!eventId) {
                document.getElementById('event-detail').innerHTML = '<div class="container" style="padding:64px 0;"><p>Event not found.</p></div>';
                return;
            }

            // Fetch event details from the backend
            fetch(`/api/events/${eventId}`)
                .then(response => response.json())
                .then(event => {
                    if (!event) {
                        document.getElementById('event-detail').innerHTML = '<div class="container" style="padding:64px 0;"><p>Event not found.</p></div>';
                        return;
                    }

                    const date = new Date(event.eventDate);
                    const genre = (event.genres && event.genres[0]) || 'Live';
                    const SERVICE_FEE = 4.99;

                    document.getElementById('event-detail').innerHTML = `
                        <div class="detail-hero" style="background-image:url('${event.images[0]}');">
                            <div class="container content">
                                <div class="breadcrumb"><a href="events.html">Events</a> / ${event.eventName}</div>
                                <div class="pill-row">
                                    <span class="pill-genre">${genre}</span>
                                    <span class="pill-genre"><i class="fas fa-fire" aria-hidden="true" style="margin-right:5px;"></i>${urgencyTag(event)}</span>
                                </div>
                                <h1>${event.eventName}</h1>
                                <div class="detail-meta">
                                    <span><i class="fas fa-calendar-day" aria-hidden="true"></i> ${date.toLocaleDateString()}</span>
                                    <span><i class="fas fa-clock" aria-hidden="true"></i> ${event.eventTime}</span>
                                    <span><i class="fas fa-location-dot" aria-hidden="true"></i> ${event.venue.name}, ${event.venue.location.city}</span>
                                </div>
                            </div>
                        </div>

                        <div class="container detail-layout">
                            <div>
                                <div class="panel">
                                    <h2>Event details</h2>
                                    <p class="desc">${event.description}</p>
                                    <div class="info-tiles">
                                        <div class="info-tile">
                                            <span class="ic"><i class="fas fa-calendar-day" aria-hidden="true"></i></span>
                                            <div><div class="label">Date</div><div class="value">${date.toLocaleDateString()}</div></div>
                                        </div>
                                        <div class="info-tile">
                                            <span class="ic"><i class="fas fa-clock" aria-hidden="true"></i></span>
                                            <div><div class="label">Time</div><div class="value">${event.eventTime}</div></div>
                                        </div>
                                        <div class="info-tile">
                                            <span class="ic"><i class="fas fa-location-dot" aria-hidden="true"></i></span>
                                            <div><div class="label">Venue</div><div class="value">${event.venue.name}, ${event.venue.location.city}</div></div>
                                        </div>
                                        <div class="info-tile">
                                            <span class="ic"><i class="fas fa-shield-halved" aria-hidden="true"></i></span>
                                            <div><div class="label">Age limit</div><div class="value">${event.ageRestriction || 'All ages'}</div></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="panel">
                                    <h2>Artists</h2>
                                    ${event.artists.map(artist => `
                                        <div class="artist-row">
                                            <img src="${artist.imageUrl}" alt="${artist.name}">
                                            <div>
                                                <h4>${artist.name}</h4>
                                                <p>${artist.bio}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="purchase-box">
                                <div class="ph">Ticket options</div>
                                <div class="pb">
                                    <div id="tier-list">
                                        ${event.ticketTypes.map((type, i) => `
                                            <label class="tier${i === 0 ? ' selected' : ''}">
                                                <div class="trow">
                                                    <input type="radio" name="tier" value="${i}" ${i === 0 ? 'checked' : ''} aria-label="${type.name}, $${type.price.toFixed(2)}">
                                                    <span class="tname">${type.name}</span>
                                                    <span class="tprice">$${type.price.toFixed(2)}</span>
                                                </div>
                                                <div class="tavail">${type.available} available</div>
                                            </label>
                                        `).join('')}
                                    </div>

                                    <div class="qty-row">
                                        <span class="qty-label">Quantity</span>
                                        <div class="qty-stepper">
                                            <button type="button" id="qty-decrease" aria-label="Decrease quantity"><i class="fas fa-minus" aria-hidden="true"></i></button>
                                            <span id="ticket-qty">1</span>
                                            <button type="button" id="qty-increase" aria-label="Increase quantity"><i class="fas fa-plus" aria-hidden="true"></i></button>
                                        </div>
                                    </div>

                                    <div class="summary-box">
                                        <div class="summary-row"><span id="summary-qty-label">1 &times; $${event.ticketTypes[0].price.toFixed(2)}</span><span id="summary-subtotal">$${event.ticketTypes[0].price.toFixed(2)}</span></div>
                                        <div class="summary-row"><span>Service fee</span><span id="summary-fee">$${SERVICE_FEE.toFixed(2)}</span></div>
                                        <div class="summary-row total"><span>Total</span><span id="summary-total">$${(event.ticketTypes[0].price + SERVICE_FEE).toFixed(2)}</span></div>
                                    </div>

                                    <button id="get-tickets-btn" class="btn btn-primary btn-block">
                                        <i class="fas fa-ticket-alt" aria-hidden="true"></i> Get tickets
                                    </button>

                                    <div class="trust-notes">
                                        <div class="trust-note"><i class="fas fa-lock" aria-hidden="true"></i> Secure, encrypted checkout</div>
                                        <div class="trust-note"><i class="fas fa-bolt" aria-hidden="true"></i> Instant e-tickets by email</div>
                                        <div class="trust-note"><i class="fas fa-rotate-left" aria-hidden="true"></i> Refunds on eligible orders</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    // Ticket tier / quantity / summary interaction
                    const tierTypes = event.ticketTypes;
                    let selectedIndex = 0;
                    let qty = 1;

                    function currentMax() {
                        return Math.min(8, tierTypes[selectedIndex].available || 8);
                    }

                    function updateSummary() {
                        const price = tierTypes[selectedIndex].price;
                        const subtotal = price * qty;
                        document.getElementById('summary-qty-label').textContent = `${qty} × $${price.toFixed(2)}`;
                        document.getElementById('summary-subtotal').textContent = `$${subtotal.toFixed(2)}`;
                        document.getElementById('summary-total').textContent = `$${(subtotal + SERVICE_FEE).toFixed(2)}`;
                        document.getElementById('ticket-qty').textContent = qty;
                        document.getElementById('qty-decrease').disabled = qty <= 1;
                        document.getElementById('qty-increase').disabled = qty >= currentMax();
                    }

                    document.querySelectorAll('#tier-list .tier').forEach((label, i) => {
                        label.addEventListener('click', () => {
                            document.querySelectorAll('#tier-list .tier').forEach(l => l.classList.remove('selected'));
                            label.classList.add('selected');
                            label.querySelector('input[type=radio]').checked = true;
                            selectedIndex = i;
                            qty = 1;
                            updateSummary();
                        });
                    });

                    document.getElementById('qty-decrease').addEventListener('click', () => {
                        if (qty > 1) { qty--; updateSummary(); }
                    });
                    document.getElementById('qty-increase').addEventListener('click', () => {
                        if (qty < currentMax()) { qty++; updateSummary(); }
                    });

                    updateSummary();

                    document.getElementById('get-tickets-btn').addEventListener('click', () => {
                        const user = getCurrentUser();
                        if (!user) {
                            window.location.href = 'login.html';
                            return;
                        }
                        const type = tierTypes[selectedIndex];
                        const total = (type.price * qty + SERVICE_FEE).toFixed(2);
                        localStorage.setItem('checkout', JSON.stringify({
                            eventId: event.id,
                            eventName: event.eventName,
                            ticketType: type.name,
                            qty,
                            total
                        }));
                        window.location.href = 'checkout.html';
                    });
                })
                .catch(error => {
                    console.error('Error fetching event details:', error);
                    document.getElementById('event-detail').innerHTML = '<div class="container" style="padding:64px 0;"><p>Failed to load event details. Please try again later.</p></div>';
                });
        });
    </script>
</body>
</html>
