<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Detail - SoldOutSoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .event-banner { height: 400px; background-size: cover; background-position: center; position: relative; }
        .event-banner::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%); }
        .ticket-type { transition: all 0.3s ease; }
        .ticket-type:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <div id="event-detail"></div>
    <div id="ticket-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Purchase Tickets</h3>
            <div id="modal-content"></div>
            <div class="flex justify-end space-x-3 mt-6">
                <button id="cancel-purchase" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-100">Cancel</button>
                <button id="confirm-purchase" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">Confirm Purchase</button>
            </div>
        </div>
    </div>
    <div id="footer-placeholder"></div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('nav.html').then(res => res.text()).then(html => document.getElementById('nav-placeholder').innerHTML = html);
            fetch('footer.html').then(res => res.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html);
    
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('id');
    
            if (!eventId) {
                document.getElementById('event-detail').innerHTML = '<p>Event not found.</p>';
                return;
            }
    
            // Fetch event details from the backend
            fetch(`/api/events/${eventId}`)
                .then(response => response.json())
                .then(event => {
                    if (!event) {
                        document.getElementById('event-detail').innerHTML = '<p>Event not found.</p>';
                        return;
                    }
    
                    document.getElementById('event-detail').innerHTML = `
                        <div class="event-banner" style="background-image: url('${event.images[0]}');">
                            <div class="max-w-7xl mx-auto px-4 relative h-full flex items-end pb-10">
                                <div class="text-white">
                                    <span class="bg-${event.isActive ? 'green' : 'red'}-500 text-white text-xs font-bold px-2 py-1 rounded-full mb-2 inline-block">${event.isActive ? 'Active' : 'Inactive'}</span>
                                    <h1 class="text-4xl md:text-5xl font-bold mb-2">${event.eventName}</h1>
                                    <div class="flex flex-wrap items-center text-lg">
                                        <span class="mr-4"><i class="fas fa-calendar-day mr-1"></i> ${new Date(event.eventDate).toLocaleDateString()}</span>
                                        <span class="mr-4"><i class="fas fa-clock mr-1"></i> ${event.eventTime}</span>
                                        <span><i class="fas fa-map-marker-alt mr-1"></i> ${event.venue.name}, ${event.venue.location.city}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="max-w-7xl mx-auto px-4 py-12">
                            <div class="flex flex-col lg:flex-row">
                                <div class="lg:w-2/3 lg:pr-10 mb-10 lg:mb-0">
                                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Event Details</h2>
                                    <p class="text-gray-600 mb-6">${event.description}</p>
                                    <div class="bg-gray-100 rounded-lg p-6 mb-8">
                                        <h3 class="text-xl font-bold text-gray-800 mb-4">Artists</h3>
                                        ${event.artists.map(artist => `
                                            <div class="flex items-center mb-4">
                                                <img src="${artist.imageUrl}" alt="${artist.name}" class="w-16 h-16 rounded-full object-cover mr-4">
                                                <div>
                                                    <h4 class="font-bold text-gray-800">${artist.name}</h4>
                                                    <p class="text-gray-600 text-sm">${artist.bio}</p>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="lg:w-1/3">
                                    <div class="bg-white rounded-lg shadow-md p-6 sticky top-4">
                                        <h2 class="text-2xl font-bold text-gray-800 mb-6">Ticket Options</h2>
                                        ${event.ticketTypes.map(type => `
                                            <div class="ticket-type border border-gray-200 rounded-lg p-4 mb-4">
                                                <h3 class="font-bold text-gray-800 text-lg mb-2">${type.name}</h3>
                                                <p class="text-gray-600 text-sm mb-3">Available: ${type.available}</p>
                                                <div class="flex justify-between items-center">
                                                    <span class="text-purple-600 font-bold">$${type.price.toFixed(2)}</span>
                                                    <button class="bg-purple-600 text-white px-4 py-1 rounded-full text-sm hover:bg-purple-700" onclick="buyTicket(${event.id}, '${type.name}', ${type.price})">Buy</button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
    
                    window.buyTicket = function(eventId, ticketType, price) {
                        const user = getCurrentUser();
                        if (!user) {
                            window.location.href = 'login.html';
                            return;
                        }
                        const modal = document.getElementById('ticket-modal');
                        const content = document.getElementById('modal-content');
                        content.innerHTML = `
                            <h4 class="font-bold text-gray-800 mb-2">${ticketType}</h4>
                            <div class="flex items-center justify-between mb-4">
                                <span class="font-medium text-gray-700">Quantity:</span>
                                <div class="flex items-center">
                                    <button id="decrease-qty" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-l hover:bg-gray-300"><i class="fas fa-minus"></i></button>
                                    <span id="ticket-qty" class="bg-gray-100 px-4 py-1">1</span>
                                    <button id="increase-qty" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-r hover:bg-gray-300"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                            <div class="bg-gray-100 p-3 rounded-lg">
                                <div class="flex justify-between mb-1">
                                    <span class="text-gray-700">Price per ticket:</span>
                                    <span class="font-medium">$${price.toFixed(2)}</span>
                                </div>
                                <div class="flex justify-between font-bold text-lg">
                                    <span class="text-gray-800">Total:</span>
                                    <span id="total-price" class="text-purple-600">$${price.toFixed(2)}</span>
                                </div>
                            </div>
                        `;
                        modal.classList.remove('hidden');
    
                        let qty = 1;
                        document.getElementById('decrease-qty').addEventListener('click', () => {
                            if (qty > 1) {
                                qty--;
                                document.getElementById('ticket-qty').textContent = qty;
                                document.getElementById('total-price').textContent = `$${(qty * price).toFixed(2)}`;
                            }
                        });
                        document.getElementById('increase-qty').addEventListener('click', () => {
                            qty++;
                            document.getElementById('ticket-qty').textContent = qty;
                            document.getElementById('total-price').textContent = `$${(qty * price).toFixed(2)}`;
                        });
    
                        document.getElementById('confirm-purchase').onclick = () => {
                            const total = (qty * price).toFixed(2);
                            localStorage.setItem('checkout', JSON.stringify({ eventId, ticketType, qty, total }));
                            window.location.href = 'checkout.html';
                        };
                        document.getElementById('cancel-purchase').onclick = () => modal.classList.add('hidden');
                    };
                })
                .catch(error => {
                    console.error('Error fetching event details:', error);
                    document.getElementById('event-detail').innerHTML = '<p>Failed to load event details. Please try again later.</p>';
                });
        });
    </script>
</body>
</html>
