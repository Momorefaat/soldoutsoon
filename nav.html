<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="logo">
            <span class="logo-mark"><i class="fas fa-ticket-alt" aria-hidden="true"></i></span>
            SoldOutSoon
        </a>

        <div class="header-search">
            <form id="search-form">
                <label for="search-input" class="visually-hidden">Search events or artists</label>
                <input type="text" id="search-input" placeholder="Search events, artists...">
                <button type="submit" class="search-btn" aria-label="Search">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </button>
                <div id="search-filters" class="hidden" style="position:absolute;z-index:10;margin-top:8px;width:100%;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--lines);padding:18px;">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                        <div>
                            <label for="search-date-from" style="display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;">Date from</label>
                            <input type="date" id="search-date-from" style="width:100%;border:1px solid var(--lines);border-radius:10px;padding:8px 10px;font-size:13.5px;">
                        </div>
                        <div>
                            <label for="search-date-to" style="display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;">Date to</label>
                            <input type="date" id="search-date-to" style="width:100%;border:1px solid var(--lines);border-radius:10px;padding:8px 10px;font-size:13.5px;">
                        </div>
                        <div>
                            <label for="search-artist" style="display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;">Artist</label>
                            <input type="text" id="search-artist" placeholder="Artist name" style="width:100%;border:1px solid var(--lines);border-radius:10px;padding:8px 10px;font-size:13.5px;">
                        </div>
                        <div>
                            <label for="search-genre" style="display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;">Genre</label>
                            <select id="search-genre" style="width:100%;border:1px solid var(--lines);border-radius:10px;padding:8px 10px;font-size:13.5px;">
                                <option value="">All Genres</option>
                                <option value="Pop">Pop</option>
                                <option value="Rock">Rock</option>
                                <option value="Hip Hop/Rap">Hip Hop</option>
                                <option value="R&B">R&B</option>
                                <option value="Electronic">Electronic</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-top:14px;display:flex;justify-content:flex-end;">
                        <button type="button" id="apply-filters" class="btn btn-primary btn-sm">Apply filters</button>
                    </div>
                </div>
            </form>
        </div>

        <nav class="nav-links" id="nav-links" aria-label="Primary">
            <a href="events.html" class="nav-link"><i class="fas fa-calendar-alt" aria-hidden="true"></i><span class="nav-label">Events</span></a>
            <a href="my-tickets.html" class="nav-link"><i class="fas fa-ticket-alt" aria-hidden="true"></i><span class="nav-label">My Tickets</span></a>
            <div id="user-section">
                <a href="login.html" id="user-link" class="nav-link nav-login"><i class="fas fa-user-circle" aria-hidden="true"></i><span class="nav-label">Login</span></a>
            </div>
        </nav>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // User section logic
        const user = getCurrentUser();
        const userLink = document.getElementById('user-link');
        if (user) {
            userLink.href = 'user-settings.html';
            userLink.classList.remove('nav-login');
            userLink.innerHTML = '<i class="fas fa-user-circle" aria-hidden="true"></i><span class="nav-label">' + user.username + '</span>';
            const logout = document.createElement('a');
            logout.href = '#';
            logout.className = 'nav-link';
            logout.innerHTML = '<span class="nav-label">Logout</span>';
            logout.onclick = () => { logoutUser(); window.location.href = 'index.html'; };
            document.getElementById('nav-links').appendChild(logout);
        }

        // Search functionality
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const searchFilters = document.getElementById('search-filters');
        const applyFiltersBtn = document.getElementById('apply-filters');

        // Toggle filters dropdown
        searchInput.addEventListener('focus', () => {
            searchFilters.classList.remove('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!searchForm.contains(e.target)) {
                searchFilters.classList.add('hidden');
            }
        });

        // Search function
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            performSearch();
        });

        applyFiltersBtn.addEventListener('click', () => {
            performSearch();
            searchFilters.classList.add('hidden');
        });

        function performSearch() {
            const searchTerm = searchInput.value.trim();
            const artist = document.getElementById('search-artist').value.trim();
            const genre = document.getElementById('search-genre').value;
            const dateFrom = document.getElementById('search-date-from').value;
            const dateTo = document.getElementById('search-date-to').value;

            // Build query parameters
            const params = new URLSearchParams();
            if (searchTerm) params.append('q', searchTerm);
            if (artist) params.append('artist', artist);
            if (genre) params.append('genre', genre);
            if (dateFrom) params.append('from', dateFrom);
            if (dateTo) params.append('to', dateTo);

            // Redirect to events page with search parameters
            window.location.href = `events.html?${params.toString()}`;
        }

        // Load existing search parameters if any
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('q')) {
            searchInput.value = urlParams.get('q');
        }
        if (urlParams.has('artist')) {
            document.getElementById('search-artist').value = urlParams.get('artist');
        }
        if (urlParams.has('genre')) {
            document.getElementById('search-genre').value = urlParams.get('genre');
        }
        if (urlParams.has('from')) {
            document.getElementById('search-date-from').value = urlParams.get('from');
        }
        if (urlParams.has('to')) {
            document.getElementById('search-date-to').value = urlParams.get('to');
        }
    });

    // Helper functions (these should be defined in your auth.js)
    function getCurrentUser() {
        return JSON.parse(localStorage.getItem('user')) || null;
    }

    function logoutUser() {
        localStorage.removeItem('user');
    }
</script>
