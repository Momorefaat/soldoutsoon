<nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <div class="flex items-center space-x-2">
                <i class="fas fa-ticket-alt text-purple-600 text-2xl"></i>
                <a href="index.html" class="text-xl font-bold text-gray-800">SoldOutSoon</a>
            </div>
            <div class="hidden md:flex flex-1 mx-10">
                <form id="search-form" class="relative w-full max-w-xl">
                    <input type="text" id="search-input" placeholder="Search events, artists..." 
                           class="w-full px-4 py-2 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <button type="submit" class="absolute right-3 top-2 text-gray-400 hover:text-purple-600">
                        <i class="fas fa-search"></i>
                    </button>
                    <div id="search-filters" class="hidden absolute z-10 mt-2 w-full bg-white rounded-lg shadow-lg p-4">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Date Range</label>
                                <div class="flex space-x-2">
                                    <input type="date" id="search-date-from" class="w-full px-2 py-1 border rounded">
                                    <input type="date" id="search-date-to" class="w-full px-2 py-1 border rounded">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Artist</label>
                                <input type="text" id="search-artist" class="w-full px-2 py-1 border rounded" placeholder="Artist name">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Event Type</label>
                                <select id="search-genre" class="w-full px-2 py-1 border rounded">
                                    <option value="">All Genres</option>
                                    <option value="Pop">Pop</option>
                                    <option value="Rock">Rock</option>
                                    <option value="Hip Hop/Rap">Hip Hop</option>
                                    <option value="R&B">R&B</option>
                                    <option value="Electronic">Electronic</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-end">
                            <button type="button" id="apply-filters" class="bg-purple-600 text-white px-4 py-1 rounded hover:bg-purple-700">
                                Apply Filters
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="flex items-center space-x-6" id="nav-links">
                <a href="events.html" class="text-gray-600 hover:text-purple-600"><i class="fas fa-calendar-alt text-xl"></i><span class="hidden md:inline-block ml-1">Events</span></a>
                <a href="my-tickets.html" class="text-gray-600 hover:text-purple-600"><i class="fas fa-ticket-alt text-xl"></i><span class="hidden md:inline-block ml-1">My Tickets</span></a>
                <div id="user-section">
                    <a href="login.html" id="user-link" class="text-gray-600 hover:text-purple-600"><i class="fas fa-user-circle text-xl"></i><span class="hidden md:inline-block ml-1">Login</span></a>
                </div>
            </div>
        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // User section logic
        const user = getCurrentUser();
        const userLink = document.getElementById('user-link');
        if (user) {
            userLink.href = 'user-settings.html';
            userLink.innerHTML = `<i class="fas fa-user-circle text-xl"></i><span class="hidden md:inline-block ml-1">${user.username}</span>`;
            const logout = document.createElement('a');
            logout.href = '#';
            logout.className = 'text-gray-600 hover:text-purple-600';
            logout.innerHTML = '<span class="hidden md:inline-block ml-1">Logout</span>';
            logout.onclick = () => { logoutUser(); window.location.href = 'index.html'; };
            document.getElementById('nav-links').appendChild(logout);
        }

        // Search functionality
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const searchFilters = document.getElementById('search-filters');
        const applyFiltersBtn = document.getElementById('apply-filters');

        // Toggle filters dropdown
        searchInput.addEventListener('focus', () => {
            searchFilters.classList.remove('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!searchForm.contains(e.target)) {
                searchFilters.classList.add('hidden');
            }
        });

        // Search function
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            performSearch();
        });

        applyFiltersBtn.addEventListener('click', () => {
            performSearch();
            searchFilters.classList.add('hidden');
        });

        function performSearch() {
            const searchTerm = searchInput.value.trim();
            const artist = document.getElementById('search-artist').value.trim();
            const genre = document.getElementById('search-genre').value;
            const dateFrom = document.getElementById('search-date-from').value;
            const dateTo = document.getElementById('search-date-to').value;

            // Build query parameters
            const params = new URLSearchParams();
            if (searchTerm) params.append('q', searchTerm);
            if (artist) params.append('artist', artist);
            if (genre) params.append('genre', genre);
            if (dateFrom) params.append('from', dateFrom);
            if (dateTo) params.append('to', dateTo);

            // Redirect to events page with search parameters
            window.location.href = `events.html?${params.toString()}`;
        }

        // Load existing search parameters if any
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('q')) {
            searchInput.value = urlParams.get('q');
        }
        if (urlParams.has('artist')) {
            document.getElementById('search-artist').value = urlParams.get('artist');
        }
        if (urlParams.has('genre')) {
            document.getElementById('search-genre').value = urlParams.get('genre');
        }
        if (urlParams.has('from')) {
            document.getElementById('search-date-from').value = urlParams.get('from');
        }
        if (urlParams.has('to')) {
            document.getElementById('search-date-to').value = urlParams.get('to');
        }
    });

    // Helper functions (these should be defined in your auth.js)
    function getCurrentUser() {
        // Implementation from your auth system
        return JSON.parse(localStorage.getItem('currentUser')) || null;
    }

    function logoutUser() {
        // Implementation from your auth system
        localStorage.removeItem('currentUser');
    }
</script>
