<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - SoldOutSoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
    <style>
        .stamp { font-family: 'Courier New', monospace; color: #dc2626; border: 3px solid #dc2626; padding: 5px 10px; transform: rotate(-15deg); opacity: 0.85; border-radius: 6px; background: rgba(255,255,255,.85); font-weight: 700; letter-spacing: .04em; }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <section class="section">
        <div class="container">
            <div class="page-title-row"><h1>My tickets</h1></div>
            <div id="tickets-list"></div>
        </div>
    </section>
    <div id="refund-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 p-6" style="border-radius:22px;">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Confirm Refund</h3>
            <p class="text-gray-600 mb-6">Are you sure you want to refund this ticket? This action cannot be undone.</p>
            <div class="flex justify-end space-x-3">
                <button id="cancel-refund" class="btn btn-outline">Cancel</button>
                <button id="confirm-refund" class="btn btn-primary" style="background:#dc2626;">Refund</button>
            </div>
        </div>
    </div>
    <div id="footer-placeholder"></div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            fetch('nav.html').then(res => res.text()).then(html => document.getElementById('nav-placeholder').innerHTML = html);
            fetch('footer.html').then(res => res.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html);

            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const ticketsList = document.getElementById('tickets-list');

            try {
                const response = await fetch(`/api/orders/user/${user._id}`, {
                    headers: {
                        Authorization: `Bearer ${user.token}`,
                    }
                });
                const userOrders = await response.json();
                if (!Array.isArray(userOrders) || userOrders.length === 0) {
                    ticketsList.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt" aria-hidden="true"></i><h3>No tickets yet</h3><p>Browse events and grab your next night out.</p><a href="events.html" class="btn btn-primary" style="margin-top:16px;">Browse events</a></div>';
                    return;
                }

                const statusClass = { completed: 'status-completed', pending: 'status-pending', refunded: 'status-refunded' };

                userOrders.forEach(order => {
                    const item = order.items[0]; // Assuming one event per order for simplicity
                    const eventDate = new Date(item.eventDate);
                    const isPastEvent = eventDate < new Date();
                    ticketsList.innerHTML += `
                        <div class="ticket-row">
                          <div class="thumb">
                            <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=600&q=80'}" alt="${item.eventName}">
                            ${isPastEvent ? '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;"><span class="stamp">SHOW OVER</span></div>' : ''}
                          </div>
                          <div style="flex:1;">
                            <h4 style="font-size:18px;font-weight:600;color:var(--ink);margin-bottom:8px;">${item.eventName}</h4>
                            <div class="meta-row"><i class="fas fa-calendar-day" aria-hidden="true"></i> ${eventDate.toLocaleDateString()} &bull; ${item.eventTime || 'TBD'}</div>
                            <div class="meta-row"><i class="fas fa-location-dot" aria-hidden="true"></i> ${item.venue}</div>
                            <p style="color:var(--body-text);font-size:14px;margin:10px 0 4px;"><span style="font-weight:600;color:var(--ink);">Tickets:</span> ${item.quantity} x ${item.ticketType}</p>
                            <p style="color:var(--body-text);font-size:14px;margin:0 0 10px;"><span style="font-weight:600;color:var(--ink);">Total:</span> $${order.totalAmount}</p>
                            <span class="status-pill ${statusClass[order.status] || 'status-pending'}">${order.status}</span>
                            ${order.status === 'completed' && !isPastEvent ? `<div style="margin-top:12px;"><button class="btn btn-outline btn-sm" style="color:#dc2626;border-color:#fecaca;" onclick="refundTicket('${order._id}')">Request refund</button></div>` : ''}
                          </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error fetching orders:', error);
                ticketsList.innerHTML = '<p>Error loading tickets.</p>';
            }

            window.refundTicket = async function(orderId) {
                const modal = document.getElementById('refund-modal');
                modal.classList.remove('hidden');
                document.getElementById('confirm-refund').onclick = async () => {
                    try {
                        const response = await fetch(`/api/orders/${orderId}/refund`, {
                            method: 'POST',
                            headers: {
                                Authorization: `Bearer ${user.token}`,
                            }
                        });
                        if (response.ok) {
                            alert('Ticket refunded successfully.');
                            modal.classList.add('hidden');
                            window.location.reload();
                        } else {
                            alert('Refund failed.');
                        }
                    } catch (error) {
                        console.error('Refund error:', error);
                        alert('Refund error.');
                    }
                };
                document.getElementById('cancel-refund').onclick = () => modal.classList.add('hidden');
            };
        });
    </script>
</body>
</html>
